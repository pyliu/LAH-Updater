[package]
name = "sms-env-editor"
version = "0.1.0"
description = "智慧控管與監控系統 - 地籍異動簡訊參數設定工具"
edition = "2021"

[lib]
name = "sms_env_editor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
encoding_rs = "0.8"

[profile.dev]
incremental = false
