[package]
name = "moi_sms"
version = "0.1.0"
edition = "2021"
description = "MOI_EX / SMS 設定檔讀取、核心資料編碼轉換與通訊模組"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "2"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
