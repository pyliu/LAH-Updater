[package]
name = "moi-sms-desktop"
version = "0.1.0"
edition = "2021"
description = "地籍異動通知管理桌面程式"
default-run = "moi-sms-desktop"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
moi_sms = { path = ".." }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
